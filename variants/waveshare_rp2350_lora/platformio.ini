; Waveshare RP2040-LoRa configured for RP2350 Core (Pico 2 Framework)
[waveshare_rp2350_lora_base]
extends = rp2350_base
board = rpipico2w
board_build.filesystem_size = 0.5m
build_flags =
  ${rp2350_base.build_flags}
  -I variants/waveshare_rp2350_lora
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=20
  -D P_LORA_NSS=3
  -D P_LORA_RESET=15
  -D P_LORA_BUSY=2
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=11
  -D P_LORA_TX_LED=25
  -D SX126X_DIO2_AS_RF_SWITCH=true
  ; -D SX126X_RXEN=17
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
build_src_filter = ${rp2350_base.build_src_filter}
  +<WaveshareBoard.cpp>
  +<../variants/waveshare_rp2350_lora>
lib_deps = ${rp2350_base.lib_deps}
; lib_deps =
;   jgromes/RadioLib
;   adafruit/RTClib
;   rweather/Crypto
;   ElectronicCats/CayenneLPP

[env:waveshare_rp2350_lora_repeater]
extends = waveshare_rp2350_lora_base
build_flags = ${waveshare_rp2350_lora_base.build_flags}
  -D ADVERT_NAME='"RP2350-LoRa Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = 
  ${waveshare_rp2350_lora_base.build_src_filter}
  +<../examples/simple_repeater>
; lib_deps =
;   ${waveshare_rp2350_lora_base.lib_deps}

[env:waveshare_rp2350_lora_repeater_sensor]
extends = waveshare_rp2350_lora_base
build_flags = ${waveshare_rp2350_lora_base.build_flags}
  -D ADVERT_NAME='"RP2350-LoRa Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; --- New Sensor Build Flags ---
  -D HAS_DHT11_SENSOR=1
  -D DHT_PIN=16  ; Change this to the actual GPIO pin you connect the DHT11 to
  -D DHT_TYPE=DHT11
build_src_filter = 
  ${waveshare_rp2350_lora_base.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${waveshare_rp2350_lora_base.lib_deps}
  ; --- New Sensor Libraries ---
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  ElectronicCats/CayenneLPP @ ^1.4.0

[env:waveshare_rp2350_lora_companion_radio_usb]
extends = waveshare_rp2350_lora_base
build_flags = ${waveshare_rp2350_lora_base.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
build_src_filter = 
  ${waveshare_rp2350_lora_base.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${waveshare_rp2350_lora_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:waveshare_rp2350_lora_repeater_sensor_mqtt_backlink]
extends = waveshare_rp2350_lora_base
extra_scripts = pre:read_env.py
build_flags = ${waveshare_rp2350_lora_base.build_flags}
  -D ADVERT_NAME='"RP2350-LoRa Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; --- Sensor Build Flags ---
  -D HAS_DHT11_SENSOR=1
  -D DHT_PIN=16
  -D DHT_TYPE=DHT11
  ; --- MQTT/WiFi Credentials ---
  ; Note: These are pulled in via extra_scripts = pre:read_env.py from a .env file.
  ; Alternatively, define them here:
  ; -D WIFI_SSID='"YourSSID"'
  ; -D WIFI_PASS='"YourPass"'
  ; -D MQTT_SERVER='"192.168.1.100"'
  ; -D MQTT_PORT=1883
  ; -D MQTT_USER='"meshcore"'
  ; -D MQTT_PASS='"meshcore"'
build_src_filter = 
  ${waveshare_rp2350_lora_base.build_src_filter}
  +<../custom/repeater_sensor_mqtt_backlink>
lib_deps =
  ${waveshare_rp2350_lora_base.lib_deps}
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  ElectronicCats/CayenneLPP @ ^1.4.0
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0.4

[env:waveshare_rp2350_lora_repeater_observer]
extends = waveshare_rp2350_lora_base
extra_scripts = pre:read_env.py
build_flags = ${waveshare_rp2350_lora_base.build_flags}
  -D ADVERT_NAME='"RP2350-LoRa Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D MESH_PACKET_LOGGING=1
  -D OBSERVER_IATA='"CPT"'
  ; --- Sensor Build Flags ---
  -D HAS_DHT11_SENSOR=1
  -D DHT_PIN=16
  -D DHT_TYPE=DHT11
build_src_filter = 
  ${waveshare_rp2350_lora_base.build_src_filter}
  +<../custom/repeater_observer>
lib_deps =
  ${waveshare_rp2350_lora_base.lib_deps}
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  ElectronicCats/CayenneLPP @ ^1.4.0
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0.4
