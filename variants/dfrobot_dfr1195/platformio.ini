[DFRobot_DFR1195_base]
extends = esp32_base
board = dfrobot_dfr1195
build_flags =
  ${esp32_base.build_flags}
  -I variants/dfrobot_dfr1195
  -D DFROBOT_DFR1195
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D DISPLAY_CLASS=DFR1195Display
  -D USE_PIN_TFT=1
  -D ESP32_CPU_FREQ=80
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_RUNNING_CORE=1
  -D ARDUINO_EVENT_RUNNING_CORE=1
  -D P_LORA_TX_LED=21
  -D P_LORA_DIO_1=4
  -D P_LORA_NSS=10
  -D P_LORA_RESET=41
  -D P_LORA_BUSY=40
  -D P_LORA_SCLK=7
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D SX126X_RXEN=42
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D LORA_TX_POWER=16
  -D PIN_USER_BTN=18
  -D PIN_BACK_BTN=0
  -D PIN_VBAT_READ=1
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
  -D PIN_TFT_CS=17
  -D PIN_TFT_DC=14
  -D PIN_TFT_RST=15
  -D PIN_TFT_SCL=12
  -D PIN_TFT_SDA=11
  -D PIN_TFT_VDD_CTL=48
  -D PIN_TFT_VDD_CTL_ACTIVE=HIGH
  -D PIN_TFT_LEDA_CTL=16
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D DISPLAY_ROTATION=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/dfrobot_dfr1195>
  +<helpers/ui/DFR1195Display.cpp>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:DFRobot_DFR1195_repeater]
extends = DFRobot_DFR1195_base
build_flags =
  ${DFRobot_DFR1195_base.build_flags}
  -D ADVERT_NAME='"DFRobot DFR1195 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${DFRobot_DFR1195_base.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${DFRobot_DFR1195_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:DFRobot_DFR1195_companion_radio_ble]
extends = DFRobot_DFR1195_base
build_flags =
  ${DFRobot_DFR1195_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=DFR1195Display
  -D BLE_PIN_CODE=123456
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${DFRobot_DFR1195_base.build_src_filter}
  +<helpers/ui/DFR1195Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${DFRobot_DFR1195_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:DFRobot_DFR1195_companion_radio_wifi]
extends = DFRobot_DFR1195_base
build_flags =
  ${DFRobot_DFR1195_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=DFR1195Display
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
build_src_filter = ${DFRobot_DFR1195_base.build_src_filter}
  +<helpers/ui/DFR1195Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${DFRobot_DFR1195_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:DFRobot_DFR1195_sensor]
extends = DFRobot_DFR1195_base
build_flags =
  ${DFRobot_DFR1195_base.build_flags}
  -D ADVERT_NAME='"DFRobot v1 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ENV_PIN_SDA=8
  -D ENV_PIN_SCL=9
  -D DISPLAY_CLASS=DFR1195Display
build_src_filter = ${DFRobot_DFR1195_base.build_src_filter}
  +<helpers/ui/DFR1195Display.cpp>
  +<../examples/simple_sensor>
lib_deps =
  ${DFRobot_DFR1195_base.lib_deps}
  ${esp32_ota.lib_deps}

[env:DFRobot_DFR1195_repeater_bridge_espnow]
extends = DFRobot_DFR1195_base
build_flags =
  ${DFRobot_DFR1195_base.build_flags}
  -D DISPLAY_CLASS=DFR1195Display
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
build_src_filter = ${DFRobot_DFR1195_base.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<helpers/ui/DFR1195Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${DFRobot_DFR1195_base.lib_deps}
  ${esp32_ota.lib_deps}

[env:DFRobot_DFR1195_room_server]
extends = DFRobot_DFR1195_base
build_flags =
  ${DFRobot_DFR1195_base.build_flags}
  -D DISPLAY_CLASS=DFR1195Display
  -D ADVERT_NAME='"DFRobot Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
